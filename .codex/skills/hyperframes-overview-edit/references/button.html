<!-- ============ Edit buttons ============
     Insert inside .header-right before the Aim button. -->

          <button class="history-btn" id="nav-undo" title="되돌리기: Ctrl+Z">↶</button>
          <button class="history-btn" id="nav-redo" title="다시 실행: Ctrl+Y / Ctrl+Shift+Z">↷</button>
          <button class="edit-btn" id="nav-edit" aria-label="text edit">Edit</button>
          <button class="size-btn text-tool" id="nav-w-minus">폭 줄이기</button>
          <button class="size-btn text-tool" id="nav-w-plus">폭 늘리기</button>
          <button class="size-btn text-tool" id="nav-t-minus">글자 작게</button>
          <button class="size-btn text-tool" id="nav-t-plus">글자 크게</button>
          <button class="size-btn image-tool" id="nav-img-x-minus" title="이미지 왼쪽으로">왼쪽</button>
          <button class="size-btn image-tool" id="nav-img-x-plus" title="이미지 오른쪽으로">오른쪽</button>
          <button class="size-btn image-tool" id="nav-img-y-minus" title="이미지 위로">위로</button>
          <button class="size-btn image-tool" id="nav-img-y-plus" title="이미지 아래로">아래로</button>
          <button class="size-btn image-tool" id="nav-img-z-minus" title="이미지 작게">작게</button>
          <button class="size-btn image-tool" id="nav-img-z-plus" title="이미지 크게">크게</button>
          <button class="size-btn image-tool" id="nav-crop-w-minus" title="보이는 이미지 틀 가로 줄이기">가로 좁게</button>
          <button class="size-btn image-tool" id="nav-crop-w-plus" title="보이는 이미지 틀 가로 늘리기">가로 넓게</button>
          <button class="size-btn image-tool" id="nav-crop-h-minus" title="보이는 이미지 틀 세로 줄이기">세로 낮게</button>
          <button class="size-btn image-tool" id="nav-crop-h-plus" title="보이는 이미지 틀 세로 늘리기">세로 높게</button>
          <button class="delete-btn" id="nav-delete">삭제</button>
